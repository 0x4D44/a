name: sun3-rust-gauntlet

on:
  push:
    branches: [sun3-gauntlet]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and expand source package
        shell: bash
        run: |
          set -euo pipefail
          cat archive/part* > sun3-rs.tar.gz
          echo '19f62913535d2719d37b89884143ac3823482cecb912d8d139edd00547f54077  sun3-rs.tar.gz' | sha256sum -c -
          mkdir sun3-rs
          tar -xzf sun3-rs.tar.gz -C sun3-rs
          mkdir -p sun3-rs/artifacts

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Acquire and verify genuine Sun 3/60 PROM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firmware
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/54weasels/sun3_60/main/bootprom/boot_1810_01.BIN \
            -o firmware/boot_1810_01.BIN
          echo '471bf34cc9313814726c2e3506d85a13291603e37b45aaffa71bc1154a2d4851  firmware/boot_1810_01.BIN' | sha256sum -c -

      - name: Formatting
        working-directory: sun3-rs
        run: cargo fmt --check

      - name: Unit and architecture tests
        working-directory: sun3-rs
        run: cargo test --all-targets

      - name: Clippy
        working-directory: sun3-rs
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Release build
        working-directory: sun3-rs
        run: cargo build --release

      - name: Genuine PROM interactive-monitor acceptance test
        working-directory: sun3-rs
        run: |
          ./target/release/sun3 \
            --machine sun3-60 \
            --rom ../firmware/boot_1810_01.BIN \
            --ram 4M \
            --headless \
            --expect-monitor \
            --max-instructions 250000000 \
            --transcript artifacts/prom-console.txt \
            --trace-prom \
            --trace-capacity 8192 \
            2> artifacts/boot-diagnostics.txt | tee artifacts/prom-console-stdout.txt

      - name: Record evidence
        if: always()
        working-directory: sun3-rs
        shell: bash
        run: |
          mkdir -p artifacts
          rustc --version > artifacts/toolchain.txt || true
          cargo --version >> artifacts/toolchain.txt || true
          sha256sum ../firmware/boot_1810_01.BIN > artifacts/prom-sha256.txt 2>/dev/null || true
          git -C .. rev-parse HEAD > artifacts/revision.txt || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sun3-rust-evidence
          path: sun3-rs/artifacts
          retention-days: 14
          if-no-files-found: warn
