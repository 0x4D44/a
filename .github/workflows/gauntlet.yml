name: Sun 3/60 gauntlet

on:
  push:
    branches: [sun3-rs-gauntlet]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-prom:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Expand source under test
        run: |
          cat sun3-rs-source.tar.gz.b64.part* | base64 --decode > /tmp/sun3-rs-source.tar.gz
          echo "a58d02e8a85402a94a4a533a248e7818359460ee98fceae51646531744c0fc08  /tmp/sun3-rs-source.tar.gz" | sha256sum --check
          tar -xzf /tmp/sun3-rs-source.tar.gz
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Apply compiler-guided cleanup and format
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "crates/sun3-machine/src/machine.rs": [
                  (
                      "self.ram_bytes % RAM_STEP_BYTES != 0",
                      "!self.ram_bytes.is_multiple_of(RAM_STEP_BYTES)",
                  ),
              ],
              "crates/sun3-machine/src/mmu.rs": [
                  (
                      "    #[must_use]\n    pub fn translate_peek(",
                      "    pub fn translate_peek(",
                  ),
              ],
              "crates/sun3-machine/src/trace.rs": [
                  (
                      "capacity.min(4096).max(1)",
                      "capacity.clamp(1, 4096)",
                  ),
              ],
              "crates/sun3-cli/src/main.rs": [
                  (
                      """    if report.reached_prompt() {
        if let Some(command) = &cli.command {
            let mut bytes = command.clone();
            if !bytes.ends_with(b\"\\r\") && !bytes.ends_with(b\"\\n\") {
                bytes.push(b'\\r');
            }
            machine.push_console_bytes(&bytes);
            let command_report = machine.run(&RunOptions {
                max_instructions: cli.max_instructions,
                prompt: cli.prompt.clone(),
                stop_on_prompt: true,
            });
            command_ok = command_report.reached_prompt();
        }
    }
""",
                      """    if report.reached_prompt()
        && let Some(command) = &cli.command
    {
        let mut bytes = command.clone();
        if !bytes.ends_with(b\"\\r\") && !bytes.ends_with(b\"\\n\") {
            bytes.push(b'\\r');
        }
        machine.push_console_bytes(&bytes);
        let command_report = machine.run(&RunOptions {
            max_instructions: cli.max_instructions,
            prompt: cli.prompt.clone(),
            stop_on_prompt: true,
        });
        command_ok = command_report.reached_prompt();
    }
""",
                  ),
                  (
                      """        if let Some(parent) = path.parent() {
            if !parent.as_os_str().is_empty() {
                fs::create_dir_all(parent)?;
            }
        }
""",
                      """        if let Some(parent) = path.parent()
            && !parent.as_os_str().is_empty()
        {
            fs::create_dir_all(parent)?;
        }
""",
                  ),
              ],
          }

          for filename, edits in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"expected compiler-guided edit not found in {filename}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --all-targets
      - name: Release build
        run: cargo build --release
      - name: Unmodified PROM acceptance
        run: ./scripts/acceptance.sh
      - name: Package source and binary
        if: always()
        run: |
          mkdir -p artifacts/package
          cp target/release/sun3 artifacts/package/ 2>/dev/null || true
          cp Cargo.lock artifacts/package/ 2>/dev/null || true
          tar -czf artifacts/package/sun3-rs-source.tar.gz \
            Cargo.toml rust-toolchain.toml README.md LICENSE .gitignore \
            crates docs scripts .github
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun3-rs-gauntlet
          path: artifacts/package
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sun3-rs-prom-evidence
          path: |
            artifacts/prom-boot.console
            artifacts/prom-boot.trace
          if-no-files-found: warn
          retention-days: 14
